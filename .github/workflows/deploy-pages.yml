# main 브랜치에 push하면 frontend/ + backend/data 를 합쳐 GitHub Pages에 올린다.
#
# 한 번만 해둘 설정: GitHub 저장소 → Settings → Pages → Build and deployment →
#                    Source 를 "GitHub Actions" 로 바꾼다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 정적 사이트 조립 (화면 + 데이터)
        run: node scripts/build-site.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
